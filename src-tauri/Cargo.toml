[package]
name = "shion"
version = "0.4.1"
description = "Shion - hafif, Rust tabanli Discord istemcisi"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "multipart"] }
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Ses
davey = "0.2"
opus = "0.3"
cpal = "0.15"
chacha20poly1305 = "0.10"
nnnoiseless = { version = "0.5", default-features = false }
wasapi = "0.19"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp"] }

# Kucuk ve hizli binary icin
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
